<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raw Comics — The Long Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .load-more{ display:block; margin: 26px auto 0; padding: 10px 26px; border-radius: 999px;
    border: 1px solid var(--paper-line); background: var(--paper-panel); color: var(--text-on-paper);
    font-family:'Work Sans',sans-serif; font-size: 13.5px; cursor:pointer; }
  .load-more:hover{ border-color: var(--brass); }
  select#publisherSelect{ min-width: 170px; }
</style>
</head>
<body>

<header class="hero">
  <nav class="sitenav">
    <span class="brand">The Long Box</span>
    <a href="index.html">Home</a>
    <a href="graded-comics.html">Graded Comics</a>
    <a href="raw-comics.html" class="active">Raw Comics</a>
    <a href="add-photos.html">Add Photos</a>
    <span class="auth-box" id="authBox">
      <span class="auth-status" id="authStatus"></span>
      <button class="auth-btn" id="authBtn">Sign in</button>
    </span>
  </nav>
  <div class="hero-inner">
    <p class="hero-eyebrow">A PERSONAL ARCHIVE</p>
    <h1 class="hero-title">Raw Comics</h1>
    <p class="hero-sub">Ungraded books, straight from the long box.</p>
    <div class="hero-stats" id="heroStats"></div>
  </div>
</header>

<main>
  <div class="controls">
    <div class="search-box">
      <span aria-hidden="true">🔎</span>
      <input id="searchInput" type="text" placeholder="Search series, issue, notes…">
    </div>
    <select id="publisherSelect"></select>
    <select id="sortSelect">
      <option value="series">Sort: Series A–Z</option>
      <option value="date-asc">Sort: Cover date (oldest first)</option>
      <option value="date-desc">Sort: Cover date (newest first)</option>
      <option value="value-asc">Sort: Value (low–high)</option>
      <option value="value-desc">Sort: Value (high–low)</option>
    </select>
  </div>

  <div class="chip-row" id="eraChips"></div>
  <div class="chip-row" id="extraChips"></div>

  <p class="count-line" id="countLine"></p>

  <div class="grid" id="grid"></div>
  <button class="load-more" id="loadMoreBtn" style="display:none">Load more</button>
</main>

<footer>Private collection catalogue · shared for viewing only</footer>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent" role="dialog" aria-modal="true"></div>
</div>

<script src="raw-defaults.js"></script>
<script src="raw-data.js"></script>
<script>
/*
  RAW_COMICS holds every ungraded book. Each entry:
  {
    "series": "...", "publisher": "...", "issue": "1", "title": "...",
    "age": "Bronze", "signedBy": null, "key": "No"|"Minor"|"Major",
    "keyReason": null, "variantDesc": null, "releaseDate": "...", "coverDate": "...",
    "seriesGroup": null
  }
  To add books by hand later, append objects to this array in the same shape.
*/
// RAW_COMICS now lives in raw-data.js (loaded above).

const PAGE_SIZE = 60;
let visibleCount = PAGE_SIZE;

const ERA_COLORS = { Atomic:'var(--era-atomic)', Golden:'#8a7a3a', Silver:'var(--era-silver)', Bronze:'var(--era-bronze)', Modern:'var(--era-modern)' };
function eraColor(age){ return ERA_COLORS[age] || 'var(--era-default)'; }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

let state = { q:'', publisher: 'All', era: 'All', extra: 'All', sort: 'series' };

function buildControls(){
  const pubCounts = {};
  RAW_COMICS.forEach(c=>{ if(c.publisher) pubCounts[c.publisher]=(pubCounts[c.publisher]||0)+1; });
  const pubs = Object.keys(pubCounts).sort((a,b)=> pubCounts[b]-pubCounts[a]);
  const sel = document.getElementById('publisherSelect');
  sel.innerHTML = `<option value="All">All publishers</option>` + pubs.map(p=>`<option value="${esc(p)}">${esc(p)} (${pubCounts[p]})</option>`).join('');
  sel.addEventListener('change', ()=>{ state.publisher = sel.value; visibleCount = PAGE_SIZE; render(); });

  const eras = ['All','Atomic','Golden','Silver','Bronze','Modern'];
  const eraRow = document.getElementById('eraChips');
  eraRow.innerHTML = eras.map(e=>`<span class="chip ${state.era===e?'active':''}" data-type="era" data-val="${esc(e)}">${esc(e)}${e==='All'?' Eras':' Age'}</span>`).join('');

  const extraRow = document.getElementById('extraChips');
  const extras = ['All','Key issues','Signed'];
  extraRow.innerHTML = extras.map(e=>`<span class="chip ${state.extra===e?'active':''}" data-type="extra" data-val="${esc(e)}">${esc(e)}</span>`).join('');

  document.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const type = chip.dataset.type, val = chip.dataset.val;
      state[type] = val;
      visibleCount = PAGE_SIZE;
      buildControls();
      render();
    });
  });
}

function filtered(){
  let list = RAW_COMICS.filter(c=>{
    if(state.publisher!=='All' && c.publisher!==state.publisher) return false;
    if(state.era!=='All' && c.age!==state.era) return false;
    if(state.extra==='Key issues' && (c.key==='No'||!c.key)) return false;
    if(state.extra==='Signed' && !c.signedBy) return false;
    if(state.q){
      const hay = [c.series,c.title,c.keyReason,c.signedBy,c.issue,c.variantDesc].join(' ').toLowerCase();
      if(!hay.includes(state.q.toLowerCase())) return false;
    }
    return true;
  });
  if(state.sort==='series') list.sort((a,b)=> (a.series||'').localeCompare(b.series||''));
  if(state.sort==='value-asc' || state.sort==='value-desc'){
    const mid = (c)=>{ const v = rawEff(c); return v ? ((+v.lo||0)+(+v.hi||0))/2 : null; };
    const dir = state.sort==='value-asc' ? 1 : -1;
    list.sort((a,b)=>{ const x=mid(a), y=mid(b); if(x===null && y===null) return (a.series||'').localeCompare(b.series||''); if(x===null) return 1; if(y===null) return -1; return (x-y)*dir || (a.series||'').localeCompare(b.series||''); });
  }
  if(state.sort==='date-asc' || state.sort==='date-desc'){
    const toTime = (s)=> s ? new Date(s+' 1').getTime() || 0 : 0;
    list.sort((a,b)=> toTime(a.coverDate)-toTime(b.coverDate));
    if(state.sort==='date-desc') list.reverse();
  }
  return list;
}

function rawThumb(url, w){
  return /res\.cloudinary\.com/.test(url) ? url.replace('/upload/', '/upload/w_'+w+',c_limit,q_auto,f_auto/') : url;
}

function cardHTML(c){
  const keyBadge = c.key==='Major' ? `<span class="badge key-major">★ Key issue</span>`
    : c.key==='Minor' ? `<span class="badge key-minor">Minor key</span>` : '';
  const signedBadge = c.signedBy ? `<span class="badge signed">✒ Signed</span>` : '';
  const pubBadge = c.publisher ? `<span class="badge publisher">${esc(c.publisher)}</span>` : '';
  const ev = rawEff(c), live = RAW_VALUES[c._key];
  const valHTML = isAdmin
    ? `<div class="quick-val"><input type="number" min="0" step="1" placeholder="Low £${ev&&!live?' ('+ev.lo+')':''}" value="${live?live[0]:''}"><input type="number" min="0" step="1" placeholder="High £${ev&&!live?' ('+ev.hi+')':''}" value="${live?live[1]:''}"></div>`
    : (ev ? `<div class="card-val">${ev.tag==='owner'?'':'~'}${fmtRange(ev.lo,ev.hi)}</div>` : '');
  return `<div class="slab" data-key="${esc(c.series)}|${esc(c.issue)}|${esc(c.coverDate)}" tabindex="0">
    <span class="era-tab" style="background:${eraColor(c.age)}"></span>
    ${RAW_PHOTOS[c._key] ? `<img loading="lazy" src="${esc(rawThumb(RAW_PHOTOS[c._key],400))}" alt="${esc(c.series)}" style="width:100%;height:150px;object-fit:cover;border-radius:6px;margin-bottom:10px;">` : ''}
    <div class="slab-top">
      <div>
        <div class="series-name">${esc(c.series)}</div>
        <div class="issue-line">${c.issue?('#'+esc(c.issue)):''}${c.age?(' · '+esc(c.age)+' Age'):''}</div>
      </div>
      <div style="text-align:right">
        <div class="grade-label">RAW</div>
      </div>
    </div>
    <div class="slab-title">${esc(c.title||'')}</div>
    <div class="badges">${keyBadge}${signedBadge}${pubBadge}</div>
    ${valHTML}
  </div>`;
}

let currentList = [];

function render(){
  currentList = filtered();
  const grid = document.getElementById('grid');
  const btn = document.getElementById('loadMoreBtn');
  document.getElementById('countLine').textContent = `${Math.min(visibleCount,currentList.length)} of ${currentList.length} shown · ${RAW_COMICS.length} total raw comics`;

  if(currentList.length===0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">No comics match those filters.</div>`;
    btn.style.display='none';
    return;
  }
  const slice = currentList.slice(0, visibleCount);
  grid.innerHTML = slice.map(c=>cardHTML(c)).join('');
  grid.querySelectorAll('.slab').forEach((el, i)=>{
    el.addEventListener('click', ()=> openModal(slice[i]));
    el.addEventListener('keypress', (e)=>{ if(e.key==='Enter') el.click(); });
  });
  grid.querySelectorAll('.quick-val').forEach((q, i)=>{
    q.addEventListener('click', (e)=> e.stopPropagation());
    q.addEventListener('keypress', (e)=> e.stopPropagation());
    q.querySelectorAll('input').forEach(inp=> inp.addEventListener('change', async ()=>{
      const [a, b] = q.querySelectorAll('input');
      const ok = await window.saveRawValue(slice[i], a.value, b.value);
      q.style.outline = ok ? '' : '2px solid #8a2e28';
    }));
  });
  btn.style.display = visibleCount < currentList.length ? 'block' : 'none';
}

document.getElementById('loadMoreBtn').addEventListener('click', ()=>{
  visibleCount += PAGE_SIZE;
  render();
});

function rawEff(c){
  const live = RAW_VALUES[c._key];
  if(live) return {lo:live[0], hi:live[1], tag:'owner'};
  const d = (typeof RAW_DEFAULTS !== 'undefined') && RAW_DEFAULTS[c._key];
  return d ? {lo:d[0], hi:d[1], tag: d[2] ? 'researched' : 'estimate'} : null;
}
function rawValueHTML(c){
  const ev = rawEff(c);
  const TAGS = {owner:['verified','Owner-verified'], researched:['verified','Researched'], estimate:['estimate','Estimate']};
  const display = ev
    ? `<div class="value-line">Est. value: <span class="amt">${fmtRange(ev.lo,ev.hi)}</span><span class="value-tag ${TAGS[ev.tag][0]}">${TAGS[ev.tag][1]}</span></div><div class="value-line" style="font-size:12px;color:var(--text-muted)">For a raw copy; depends on condition.</div>`
    : `<div class="value-line" style="color:var(--text-muted)">No value on file yet</div>`;
  const edit = isAdmin ? `
    <div class="value-edit">
      <input type="number" id="rawLoInput" placeholder="Low £" value="${ev?ev.lo:''}">
      <input type="number" id="rawHiInput" placeholder="High £" value="${ev?ev.hi:''}">
      <button id="rawSaveBtn">Save value</button>
    </div>
    <div class="value-save-msg" id="rawSaveMsg"></div>` : '';
  return display + edit;
}

function openModal(c){
  const backdrop = document.getElementById('modalBackdrop');
  const modal = document.getElementById('modalContent');
  const facts = [];
  if(c.variantDesc) facts.push(['Variant / Printing', c.variantDesc]);
  if(c.releaseDate) facts.push(['On-sale date', c.releaseDate]);
  if(c.coverDate) facts.push(['Cover date', c.coverDate]);
  if(c.seriesGroup) facts.push(['Series group', c.seriesGroup]);
  if(c.signedBy) facts.push(['Signed by', c.signedBy]);

  const photoUrl = RAW_PHOTOS[c._key];
  const photoHTML = photoUrl ? `<img src="${esc(rawThumb(photoUrl,900))}" alt="${esc(c.series)}" style="width:100%;max-height:320px;object-fit:contain;border-radius:8px;margin-bottom:16px;background:var(--paper);">` : '';
  const photoEdit = isAdmin ? `
    <div class="note-block"><label>Photo</label>
      <div class="dz-buttons" style="justify-content:flex-start;margin-top:4px">
        <button class="dz-btn" id="rawPhotoChoose" type="button">${photoUrl?'Replace photo':'Upload photo'}</button>
        <button class="dz-btn secondary" id="rawPhotoCamera" type="button">Use camera</button>
      </div>
      <input type="file" id="rawPhotoFile" accept="image/*" style="display:none">
      <input type="file" id="rawPhotoCam" accept="image/*" capture="environment" style="display:none">
      <div class="value-save-msg" id="rawPhotoMsg"></div>
    </div>` : '';

  modal.innerHTML = `
    <button class="modal-close" aria-label="Close">&times;</button>
    ${photoHTML}
    <span class="modal-era" style="background:${eraColor(c.age)}">${esc(c.age||'—')} Age</span>
    <h2>${esc(c.series)}${c.issue?(' #'+esc(c.issue)):''}</h2>
    <div class="modal-issue">Raw${c.key&&c.key!=='No'?(' · '+esc(c.key)+' key issue'):''}</div>
    ${c.title?`<div class="modal-title">"${esc(c.title)}"</div>`:''}
    <div class="fact-grid">
      ${facts.map(([l,v])=>`<div class="fact"><label>${esc(l)}</label><div>${esc(v)}</div></div>`).join('')}
    </div>
    ${c.keyReason?`<div class="note-block"><label>Why it's a key issue</label>${esc(c.keyReason)}</div>`:''}
    <div class="note-block">${rawValueHTML(c)}</div>
    ${photoEdit}
  `;
  modal.querySelector('.modal-close').addEventListener('click', closeModal);
  if(isAdmin){
    const fileEl = modal.querySelector('#rawPhotoFile'), camEl = modal.querySelector('#rawPhotoCam'), msgEl = modal.querySelector('#rawPhotoMsg');
    modal.querySelector('#rawPhotoChoose').addEventListener('click', ()=> fileEl.click());
    modal.querySelector('#rawPhotoCamera').addEventListener('click', ()=> camEl.click());
    const go = async (file)=>{
      if(!file) return;
      msgEl.textContent = 'Uploading…';
      const ok = await window.uploadRawPhoto(c, file);
      if(ok){ render(); openModal(c); const m2 = document.getElementById('rawPhotoMsg'); if(m2) m2.textContent = 'Photo saved.'; }
      else msgEl.textContent = 'Could not save the photo — check you are signed in as the owner.';
    };
    fileEl.addEventListener('change', e=> go(e.target.files[0]));
    camEl.addEventListener('change', e=> go(e.target.files[0]));
  }
  const rawSave = modal.querySelector('#rawSaveBtn');
  if(rawSave) rawSave.addEventListener('click', async ()=>{
    const ok = await window.saveRawValue(c, modal.querySelector('#rawLoInput').value, modal.querySelector('#rawHiInput').value);
    if(ok){ render(); openModal(c); modal.querySelector('#rawSaveMsg').textContent = 'Saved.'; }
    else modal.querySelector('#rawSaveMsg').textContent = 'Could not save — check you are signed in as the owner.';
  });
  backdrop.classList.add('open');
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('open'); }
document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') closeModal(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

document.getElementById('searchInput').addEventListener('input', (e)=>{ state.q = e.target.value; visibleCount = PAGE_SIZE; render(); });
document.getElementById('sortSelect').addEventListener('change', (e)=>{ state.sort = e.target.value; visibleCount = PAGE_SIZE; render(); });

function fmtRange(lo,hi){ const f=n=>'£'+Math.round(n).toLocaleString('en-GB'); return lo===hi?f(lo):f(lo)+'–'+f(hi); }
function rawTotals(){
  let lo=0, hi=0, n=0;
  RAW_COMICS.forEach(c=>{ const v = rawEff(c); if(v){ lo += +v.lo||0; hi += +v.hi||0; if(v.tag==='owner') n++; } });
  return {lo,hi,n};
}
function buildStats(){
  const total = RAW_COMICS.length;
  const rt = rawTotals();
  const keyCount = RAW_COMICS.filter(c=>c.key && c.key!=='No').length;
  const signedCount = RAW_COMICS.filter(c=>c.signedBy).length;
  const pubs = new Set(RAW_COMICS.map(c=>c.publisher).filter(Boolean)).size;
  document.getElementById('heroStats').innerHTML = `
    <div class="stat"><b>${total}</b><span>Raw comics</span></div>
    <div class="stat"><b>${fmtRange(rt.lo,rt.hi)}</b><span>Total value (rough estimate${rt.n?`, ${rt.n.toLocaleString('en-GB')} owner-verified`:''})</span></div>
    <div class="stat"><b>${keyCount}</b><span>Key issues</span></div>
    <div class="stat"><b>${signedCount}</b><span>Signed copies</span></div>
    <div class="stat"><b>${pubs}</b><span>Publishers</span></div>
  `;
}

// Give every raw comic a stable key (duplicates of the same book get -2, -3, ...) for saving values
var RAW_VALUES = {};
var RAW_PHOTOS = {}; // comic _key -> photo URL (uploaded here or on add-photos.html)
var isAdmin = false;
// (each comic's stable _key is now assigned at the bottom of raw-data.js)

buildStats();
buildControls();
render();
</script>

<script type="module">
  const firebaseConfig = {
    apiKey: "AIzaSyBCcWqwx9WaPN_Z-SfvGX84I15RCkcK9qk",
    authDomain: "comics-9af44.firebaseapp.com",
    projectId: "comics-9af44",
    storageBucket: "comics-9af44.firebasestorage.app",
    messagingSenderId: "1047883288836",
    appId: "1:1047883288836:web:4f9c45cd33e76134e0c051"
  };
  const ADMIN_EMAIL = "alexneal50@gmail.com";

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, serverTimestamp, deleteField
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();
  const authBtn = document.getElementById('authBtn');
  const authStatus = document.getElementById('authStatus');

  authBtn.addEventListener('click', () => {
    if(auth.currentUser){ signOut(auth); }
    else { signInWithPopup(auth, provider).catch(err => { console.error(err); alert('Sign-in failed: ' + err.message); }); }
  });

  onAuthStateChanged(auth, (user) => {
    if(user){
      window.isAdmin = (user.email === ADMIN_EMAIL);
      authStatus.textContent = user.email + (window.isAdmin ? ' (editing on)' : ' (view only)');
      authBtn.textContent = 'Sign out';
    } else {
      window.isAdmin = false;
      authStatus.textContent = '';
      authBtn.textContent = 'Sign in';
    }
    render();
  });

  // All raw values live in ONE document (comicValues/raw-comics), so each page view costs a single read
  async function loadRawValues(){
    try{
      const snap = await getDoc(doc(db, 'comicValues', 'raw-comics'));
      window.RAW_VALUES = snap.exists() ? (snap.data().values || {}) : {};
    } catch(err){
      console.error('Could not load raw values from Firestore', err);
    }
    buildStats();
    render();
  }
  loadRawValues();

  // ---- Raw comic photos: images live on Cloudinary, all the URLs live in ONE Firestore doc (comicPhotos/raw-photos) ----
  const CLOUDINARY_CLOUD_NAME = "bdjxljvf";
  const CLOUDINARY_UPLOAD_PRESET = "e5n1likv";
  const MAX_DIMENSION = 1200;

  async function loadRawPhotos(){
    try{
      const snap = await getDoc(doc(db, 'comicPhotos', 'raw-photos'));
      window.RAW_PHOTOS = snap.exists() ? (snap.data().photos || {}) : {};
    } catch(err){
      console.error('Could not load raw photos from Firestore', err);
    }
    render();
  }
  loadRawPhotos();

  function resizeImage(file, maxDim){
    return new Promise((resolve) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.85);
      };
      reader.readAsDataURL(file);
    });
  }

  window.uploadRawPhoto = async function(c, file){
    try{
      const resized = await resizeImage(file, MAX_DIMENSION);
      const formData = new FormData();
      formData.append('file', resized, 'raw-' + c._key + '.jpg');
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      formData.append('public_id', 'raw-' + c._key);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
      const data = await res.json();
      if(!res.ok || !data.secure_url) throw new Error(data.error ? data.error.message : 'Cloudinary upload failed');
      await setDoc(doc(db, 'comicPhotos', 'raw-photos'),
        { photos: { [c._key]: data.secure_url }, updatedAt: serverTimestamp() },
        { merge: true });
      window.RAW_PHOTOS[c._key] = data.secure_url;
      return true;
    } catch(err){
      console.error(err);
      return false;
    }
  };

  // Called from the page's own script. Empty low AND high clears the value.
  window.saveRawValue = async function(c, loStr, hiStr){
    let lo = parseFloat(loStr), hi = parseFloat(hiStr);
    const clear = isNaN(lo) && isNaN(hi);
    if(!clear){
      if(isNaN(lo)) lo = hi;
      if(isNaN(hi)) hi = lo;
      if(lo > hi){ const t = lo; lo = hi; hi = t; }
    }
    try{
      await setDoc(doc(db, 'comicValues', 'raw-comics'),
        { values: { [c._key]: clear ? deleteField() : [lo, hi] }, updatedAt: serverTimestamp() },
        { merge: true });
      if(clear) delete window.RAW_VALUES[c._key]; else window.RAW_VALUES[c._key] = [lo, hi];
      buildStats();
      return true;
    } catch(err){
      console.error(err);
      return false;
    }
  };
</script>
</body>
</html>
