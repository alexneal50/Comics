let visibleCount = PAGE_SIZE;

const ERA_COLORS = { Atomic:'var(--era-atomic)', Golden:'#8a7a3a', Silver:'var(--era-silver)', Bronze:'var(--era-bronze)', Modern:'var(--era-modern)' };
function eraColor(age){ return ERA_COLORS[age] || 'var(--era-default)'; }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

let state = { q:'', publisher: 'All', era: 'All', extra: 'All', sort: 'series' };

function buildControls(){
  const pubCounts = {};
  RAW_COMICS.forEach(c=>{ if(c.publisher) pubCounts[c.publisher]=(pubCounts[c.publisher]||0)+1; });
  const pubs = Object.keys(pubCounts).sort((a,b)=> pubCounts[b]-pubCounts[a]);
  const sel = document.getElementById('publisherSelect');
  sel.innerHTML = `<option value="All">All publishers</option>` + pubs.map(p=>`<option value="${esc(p)}">${esc(p)} (${pubCounts[p]})</option>`).join('');
  sel.addEventListener('change', ()=>{ state.publisher = sel.value; visibleCount = PAGE_SIZE; render(); });

  const eras = ['All','Atomic','Golden','Silver','Bronze','Modern'];
  const eraRow = document.getElementById('eraChips');
  eraRow.innerHTML = eras.map(e=>`<span class="chip ${state.era===e?'active':''}" data-type="era" data-val="${esc(e)}">${esc(e)}${e==='All'?' Eras':' Age'}</span>`).join('');

  const extraRow = document.getElementById('extraChips');
  const extras = ['All','Key issues','Signed'];
  extraRow.innerHTML = extras.map(e=>`<span class="chip ${state.extra===e?'active':''}" data-type="extra" data-val="${esc(e)}">${esc(e)}</span>`).join('');

  document.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const type = chip.dataset.type, val = chip.dataset.val;
      state[type] = val;
      visibleCount = PAGE_SIZE;
      buildControls();
      render();
    });
  });
}

function filtered(){
  let list = RAW_COMICS.filter(c=>{
    if(state.publisher!=='All' && c.publisher!==state.publisher) return false;
    if(state.era!=='All' && c.age!==state.era) return false;
    if(state.extra==='Key issues' && (c.key==='No'||!c.key)) return false;
    if(state.extra==='Signed' && !c.signedBy) return false;
    if(state.q){
      const hay = [c.series,c.title,c.keyReason,c.signedBy,c.issue,c.variantDesc].join(' ').toLowerCase();
      if(!hay.includes(state.q.toLowerCase())) return false;
    }
    return true;
  });
  if(state.sort==='series') list.sort((a,b)=> (a.series||'').localeCompare(b.series||''));
  if(state.sort==='date-asc' || state.sort==='date-desc'){
    const toTime = (s)=> s ? new Date(s+' 1').getTime() || 0 : 0;
    list.sort((a,b)=> toTime(a.coverDate)-toTime(b.coverDate));
    if(state.sort==='date-desc') list.reverse();
  }
  return list;
}

function cardHTML(c){
  const keyBadge = c.key==='Major' ? `<span class="badge key-major">★ Key issue</span>`
    : c.key==='Minor' ? `<span class="badge key-minor">Minor key</span>` : '';
  const signedBadge = c.signedBy ? `<span class="badge signed">✒ Signed</span>` : '';
  const pubBadge = c.publisher ? `<span class="badge publisher">${esc(c.publisher)}</span>` : '';
  return `<div class="slab" data-key="${esc(c.series)}|${esc(c.issue)}|${esc(c.coverDate)}" tabindex="0">
    <span class="era-tab" style="background:${eraColor(c.age)}"></span>
    <div class="slab-top">
      <div>
        <div class="series-name">${esc(c.series)}</div>
        <div class="issue-line">${c.issue?('#'+esc(c.issue)):''}${c.age?(' · '+esc(c.age)+' Age'):''}</div>
      </div>
      <div style="text-align:right">
        <div class="grade-label">RAW</div>
      </div>
    </div>
    <div class="slab-title">${esc(c.title||'')}</div>
    <div class="badges">${keyBadge}${signedBadge}${pubBadge}</div>
  </div>`;
}

let currentList = [];

function render(){
  currentList = filtered();
  const grid = document.getElementById('grid');
  const btn = document.getElementById('loadMoreBtn');
  document.getElementById('countLine').textContent = `${Math.min(visibleCount,currentList.length)} of ${currentList.length} shown · ${RAW_COMICS.length} total raw comics`;

  if(currentList.length===0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">No comics match those filters.</div>`;
    btn.style.display='none';
    return;
  }
  const slice = currentList.slice(0, visibleCount);
  grid.innerHTML = slice.map(c=>cardHTML(c)).join('');
  grid.querySelectorAll('.slab').forEach((el, i)=>{
    el.addEventListener('click', ()=> openModal(slice[i]));
    el.addEventListener('keypress', (e)=>{ if(e.key==='Enter') el.click(); });
  });
  btn.style.display = visibleCount < currentList.length ? 'block' : 'none';
}

document.getElementById('loadMoreBtn').addEventListener('click', ()=>{
  visibleCount += PAGE_SIZE;
  render();
});

function openModal(c){
  const backdrop = document.getElementById('modalBackdrop');
  const modal = document.getElementById('modalContent');
  const facts = [];
  if(c.variantDesc) facts.push(['Variant / Printing', c.variantDesc]);
  if(c.releaseDate) facts.push(['On-sale date', c.releaseDate]);
  if(c.coverDate) facts.push(['Cover date', c.coverDate]);
  if(c.seriesGroup) facts.push(['Series group', c.seriesGroup]);
  if(c.signedBy) facts.push(['Signed by', c.signedBy]);

  modal.innerHTML = `
    <button class="modal-close" aria-label="Close">&times;</button>
    <span class="modal-era" style="background:${eraColor(c.age)}">${esc(c.age||'—')} Age</span>
    <h2>${esc(c.series)}${c.issue?(' #'+esc(c.issue)):''}</h2>
    <div class="modal-issue">Raw${c.key&&c.key!=='No'?(' · '+esc(c.key)+' key issue'):''}</div>
    ${c.title?`<div class="modal-title">"${esc(c.title)}"</div>`:''}
    <div class="fact-grid">
      ${facts.map(([l,v])=>`<div class="fact"><label>${esc(l)}</label><div>${esc(v)}</div></div>`).join('')}
    </div>
    ${c.keyReason?`<div class="note-block"><label>Why it's a key issue</label>${esc(c.keyReason)}</div>`:''}
  `;
  modal.querySelector('.modal-close').addEventListener('click', closeModal);
  backdrop.classList.add('open');
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('open'); }
document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') closeModal(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

document.getElementById('searchInput').addEventListener('input', (e)=>{ state.q = e.target.value; visibleCount = PAGE_SIZE; render(); });
document.getElementById('sortSelect').addEventListener('change', (e)=>{ state.sort = e.target.value; visibleCount = PAGE_SIZE; render(); });

function buildStats(){
  const total = RAW_COMICS.length;
  const keyCount = RAW_COMICS.filter(c=>c.key && c.key!=='No').length;
  const signedCount = RAW_COMICS.filter(c=>c.signedBy).length;
  const pubs = new Set(RAW_COMICS.map(c=>c.publisher).filter(Boolean)).size;
  document.getElementById('heroStats').innerHTML = `
    <div class="stat"><b>${total}</b><span>Raw comics</span></div>
    <div class="stat"><b>${keyCount}</b><span>Key issues</span></div>
    <div class="stat"><b>${signedCount}</b><span>Signed copies</span></div>
    <div class="stat"><b>${pubs}</b><span>Publishers</span></div>
  `;
}

buildStats();
buildControls();
render();
</script>
</body>
</html>
